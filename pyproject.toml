[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "smileid"
version = "12.0.0"
description = "Official Smile ID server-side SDK for Python — V3 APIs."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Smile Identity", email = "support@smileidentity.com" },
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "httpx>=0.24",
    "pydantic>=2.0",
]

[project.urls]
Homepage = "https://github.com/smileidentity/smileid-sdk-python"
Issues = "https://github.com/smileidentity/smileid-sdk-python/issues"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "respx>=0.20",
    "ruff>=0.4",
    "mypy>=1.8",
]

[tool.hatch.build.targets.wheel]
packages = ["smileid"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# UP (pyupgrade) is intentionally omitted so generated Pydantic annotations
# remain conservative across the supported Python matrix.
select = ["E", "F", "I", "B", "W"]

[tool.mypy]
# Runtime compatibility is covered by the CI test matrix.
packages = ["smileid"]
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
