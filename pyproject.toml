[build-system]
# Pinned, so a new hatchling release can't break the build. Python 3.8 to 3.10
# get the last hatchling that supports 3.8.
requires = [
    "hatchling==1.27.0; python_version < '3.11'",
    "hatchling==1.33.0; python_version >= '3.11'",
]
build-backend = "hatchling.build"

[project]
name = "usesmileid"
version = "13.0.0"
description = "Official Smile ID server-side SDK for Python — V3 APIs."
readme = "README.md"
license = "MIT"
requires-python = ">=3.8"
authors = [
    { name = "Smile Identity", email = "support@smileidentity.com" },
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "httpx>=0.24",
    "pydantic>=2.0",
]

[project.urls]
Homepage = "https://github.com/smileidentity/smileid-sdk-python"
Issues = "https://github.com/smileidentity/smileid-sdk-python/issues"

[project.optional-dependencies]
# Exact versions, so a new tool release can't turn CI or a release red. Python
# 3.8 to 3.10 get the last versions that support 3.8, which CI still tests.
# Bump these by hand.
dev = [
    "coverage[toml]==7.6.1; python_version < '3.11'",
    "coverage[toml]==7.17.3; python_version >= '3.11'",
    "mypy==1.14.1; python_version < '3.11'",
    "mypy==2.4.1; python_version >= '3.11'",
    "pytest==8.3.5; python_version < '3.11'",
    "pytest==9.2.0; python_version >= '3.11'",
    "pytest-cov==5.0.0; python_version < '3.11'",
    "pytest-cov==7.1.0; python_version >= '3.11'",
    "respx==0.23.1",
    "ruff==0.17.5",
]

[tool.hatch.build.targets.wheel]
packages = ["usesmileid"]

[tool.ruff]
line-length = 100
target-version = "py38"

[tool.ruff.lint]
# UP (pyupgrade) is intentionally omitted: the SDK targets Python 3.8+, and
# rewriting typing.Optional/Union to `X | Y` breaks Pydantic annotation
# evaluation on 3.8/3.9.
select = ["E", "F", "I", "B", "W"]

[tool.mypy]
# No python_version pin: recent mypy releases no longer accept a 3.8 target.
# Runtime compatibility with 3.8 is covered by the CI test matrix.
packages = ["usesmileid"]
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true

[tool.coverage.run]
source = ["usesmileid"]
branch = true
