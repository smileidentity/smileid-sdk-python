[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "smile-identity-core"
version = "0.1.0"
description = "Official Smile ID server-side SDK for Python — V3 APIs."
readme = "README.md"
license = "MIT"
requires-python = ">=3.8"
authors = [
    { name = "Smile Identity", email = "support@smileidentity.com" },
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/smileidentity/smileid-sdk-python"
Issues = "https://github.com/smileidentity/smileid-sdk-python/issues"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.4",
    "mypy>=1.8",
]

[tool.hatch.build.targets.wheel]
packages = ["smileid"]

[tool.ruff]
line-length = 100
target-version = "py38"

[tool.mypy]
python_version = "3.8"
packages = ["smileid"]
