# Quality gates for every pull request: public API breaks against the last
# release, coverage of the generated layer and of changed lines, and the
# release scripts' own tests.
#
# A bot PR is one labelled `spec-sync`, `parity-port` or `release`, or opened
# by an account whose login ends in `[bot]`. The changed-lines coverage and
# exclusion checks only fail bot PRs; on other PRs they report without failing.

name: Quality Gates

on:
  pull_request:
    # `labeled` and `unlabeled` re-run the gates when `breaking` or a bot
    # label is added or removed.
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

concurrency:
  group: quality-gates-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  IS_BOT_PR: >-
    ${{ contains(github.event.pull_request.labels.*.name, 'spec-sync')
    || contains(github.event.pull_request.labels.*.name, 'parity-port')
    || contains(github.event.pull_request.labels.*.name, 'release')
    || endsWith(github.event.pull_request.user.login, '[bot]') }}

jobs:
  api-compat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install griffe
        run: pip install "griffe>=1.0"
      - name: Compare public API with the latest release
        env:
          BASE_REF: ${{ github.base_ref }}
          HAS_BREAKING_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'breaking') }}
        run: |
          set -euo pipefail
          tag=$(git tag --merged "origin/$BASE_REF" --list 'v*' --sort=-v:refname | head -n 1)
          if [ -z "$tag" ]; then
            echo "::notice::No v* release tag yet, so there is no released API to compare against."
            exit 0
          fi
          echo "Comparing the public API with $tag"

          # griffe exits 1 when it finds breaks. Print them as
          # "file: object: change", without the line number, so the two
          # lists compare even when the PR moves code around.
          breaks() {
            local out rc=0
            out=$(griffe check usesmileid --search . --against "$tag" --no-color "$@" 2>&1) || rc=$?
            if [ "$rc" -ne 0 ] && ! printf '%s\n' "$out" | grep -qE '^[^ ]+:[0-9]+: '; then
              printf '%s\n' "$out" >&2
              echo "::error::griffe failed to load the package"
              exit 1
            fi
            printf '%s\n' "$out" | grep -E '^[^ ]+:[0-9]+: ' | sed -E 's/^([^ ]+):[0-9]+: /\1: /' | sort -u
          }
          breaks > head-breaks.txt
          # Breaks already on the base branch were judged when they merged.
          # Only breaks this PR adds need the `breaking` label.
          breaks --base-ref "origin/$BASE_REF" > base-breaks.txt
          comm -12 base-breaks.txt head-breaks.txt > existing-breaks.txt
          comm -13 base-breaks.txt head-breaks.txt > new-breaks.txt

          if [ -s existing-breaks.txt ]; then
            echo "::warning::$BASE_REF already breaks the public API of $tag. The next release needs a major version."
            sed 's/^/  /' existing-breaks.txt
          fi
          if [ ! -s new-breaks.txt ]; then
            echo "This PR does not break the public API of $tag."
            exit 0
          fi
          echo "This PR breaks the public API of $tag:"
          while IFS= read -r line; do
            if [ "$HAS_BREAKING_LABEL" = "true" ]; then
              echo "::warning::$line"
            else
              echo "::error::$line"
            fi
          done < new-breaks.txt
          if [ "$HAS_BREAKING_LABEL" != "true" ]; then
            echo "Add the 'breaking' label if this break is intended. The release then needs a major version."
            exit 1
          fi

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install package
        run: pip install -e ".[dev]" "diff-cover>=9.0"
      - name: Test with coverage
        run: pytest --cov=usesmileid --cov-branch --cov-report=xml --cov-report=term-missing
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: error
      - name: Require 100% line and branch coverage of generated/
        run: coverage report --include='usesmileid/generated/*' --show-missing --fail-under=100
      - name: Coverage of changed lines
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if diff-cover coverage.xml --compare-branch="origin/$BASE_REF" --fail-under=100; then
            exit 0
          fi
          if [ "$IS_BOT_PR" = "true" ]; then
            echo "::error::Bot PRs must cover every changed line."
            exit 1
          fi
          echo "::warning::Some changed lines are not covered. This only fails bot PRs."
      - name: Block new coverage exclusions
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if scripts/check-coverage-exclusions.sh "origin/$BASE_REF"; then
            exit 0
          fi
          if [ "$IS_BOT_PR" = "true" ]; then
            echo "::error::Bot PRs must not add coverage exclusions."
            exit 1
          fi
          echo "::warning::This PR adds coverage exclusions. This only fails bot PRs."

  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test bump-version.sh
        run: scripts/test-bump-version.sh
