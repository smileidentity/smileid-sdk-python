# Not present in the org's other core SDK repos (ruby / js); added here as a
# standard community-health workflow, following the org's SHA-pinning convention.

name: Mark stale issues and pull requests

on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@eb5cf3af3ac0a1aa4c9c45633dd1ae542a27a899 # v10.3.0
        with:
          days-before-stale: 60
          days-before-close: 14
          stale-issue-message: >-
            This issue has been automatically marked as stale because it has had no
            activity for 60 days. It will be closed in 14 days if no further activity occurs.
          stale-pr-message: >-
            This pull request has been automatically marked as stale because it has had no
            activity for 60 days. It will be closed in 14 days if no further activity occurs.
          stale-issue-label: stale
          stale-pr-label: stale
          exempt-issue-labels: pinned,security
          exempt-pr-labels: pinned,security
