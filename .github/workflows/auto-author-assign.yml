# Not present in the org's other core SDK repos (ruby / js); added here as a
# standard community-health workflow, following the org's SHA-pinning convention.

name: Auto Author Assign

on:
  pull_request_target:
    types: [opened, reopened]

permissions:
  pull-requests: write

jobs:
  assign-author:
    runs-on: ubuntu-latest
    steps:
      - uses: kentaro-m/auto-assign-action@f4648c0a9fdb753479e9e75fc251f507ce17bb7e # v2.0.0
        with:
          configuration-path: .github/auto-assign.yml
