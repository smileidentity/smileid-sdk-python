# Publishes usesmileid to PyPI when a `vX.Y.Z` tag is pushed. Uses PyPI
# trusted publishing (OIDC) — no long-lived token stored in this repo.

name: Release

on:
  push:
    tags:
      # vX.Y.Z plus any PEP 440 suffix (v1.2.3rc1, v1.2.3.post1). Keeps a
      # stray tag like `vtest` from starting a publish job at all.
      - 'v[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: read

# One publish at a time per tag, so a re-pushed tag can't race itself.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'smileidentity/smileid-sdk-python'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: write
      id-token: write
      # Lists merged PRs for the breaking-change rule below.
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history and tags, to find the previous release.
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Check version, changelog and breaking changes
        env:
          GH_TOKEN: ${{ github.token }}
        # The tag must match pyproject.toml and have a dated CHANGELOG.md
        # heading, and the major version must match the PRs labelled
        # `breaking` since the previous stable tag. Pull requests labelled
        # `release` run the same script before the tag is pushed.
        run: scripts/check-release.sh "$GITHUB_REF_NAME"

      - name: Install package
        run: pip install -e ".[dev]"

      - name: Test
        run: pytest

      - name: Lint
        run: ruff check .

      - name: Type check
        run: mypy usesmileid

      - name: Build sdist and wheel
        run: |
          # Clear anything an earlier step left behind, so `twine check` and
          # the publish below only ever see this build's artefacts.
          rm -rf dist build
          pip install "build==1.6.1" "twine==7.0.0"
          python -m build
          # Catches broken metadata or an unrenderable README before the
          # upload, which PyPI will not let us replace.
          twine check --strict dist/*

      - name: Smoke-test built wheel
        run: |
          python -m venv /tmp/wheel-smoke
          /tmp/wheel-smoke/bin/pip install "$(ls dist/*.whl)"
          cd /tmp && /tmp/wheel-smoke/bin/python -c "import usesmileid"

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          skip-existing: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --verify-tag --generate-notes
          fi
