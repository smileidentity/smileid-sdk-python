# Publishes usesmileid to PyPI when a `vX.Y.Z` tag is pushed. Uses PyPI
# trusted publishing (OIDC) — no long-lived token stored in this repo.

name: Release

on:
  push:
    tags:
      # vX.Y.Z plus any PEP 440 suffix (v1.2.3rc1, v1.2.3.post1). Keeps a
      # stray tag like `vtest` from starting a publish job at all.
      - 'v[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: read

# One publish at a time per tag, so a re-pushed tag can't race itself.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'smileidentity/smileid-sdk-python'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Check tag matches package version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag v$TAG_VERSION does not match pyproject.toml version $PKG_VERSION"
            exit 1
          fi

      - name: Check CHANGELOG has an entry for this version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if ! grep -qE "^## \[${TAG_VERSION}\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [$TAG_VERSION]' heading for tag $GITHUB_REF_NAME"
            exit 1
          fi

      - name: Install package
        run: pip install -e ".[dev]"

      - name: Test
        run: pytest

      - name: Lint
        run: ruff check .

      - name: Type check
        run: mypy usesmileid

      - name: Build sdist and wheel
        run: |
          # Clear anything an earlier step left behind, so `twine check` and
          # the publish below only ever see this build's artefacts.
          rm -rf dist build
          pip install build twine
          python -m build
          # Catches broken metadata or an unrenderable README before the
          # upload, which PyPI will not let us replace.
          twine check --strict dist/*

      - name: Smoke-test built wheel
        run: |
          python -m venv /tmp/wheel-smoke
          /tmp/wheel-smoke/bin/pip install "$(ls dist/*.whl)"
          cd /tmp && /tmp/wheel-smoke/bin/python -c "import usesmileid"

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          skip-existing: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --verify-tag --generate-notes
          fi
