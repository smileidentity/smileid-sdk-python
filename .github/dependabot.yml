version: 2
updates:
  - package-ecosystem: pip
    open-pull-requests-limit: 5
    directory: /
    schedule:
      interval: weekly
    groups:
      python:
        patterns:
          - '*'
  - package-ecosystem: github-actions
    open-pull-requests-limit: 5
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - '*'
